services:

  estoque-api:
    container_name: korp-estoque-api
    build:
      context: ./Backend/Korp.Estoque
      dockerfile: Korp.Estoque.Api/Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      - rabbitmq
    networks:
      - korp-network

  faturamento-api:
    container_name: korp-faturamento-api
    build:
      context: ./Backend/Korp.Faturamento
      dockerfile: Korp.Faturamento.Api/Dockerfile
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      - rabbitmq
    networks:
      - korp-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: korp-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - korp-network

networks:
  korp-network:
    driver: bridge